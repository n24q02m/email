# HTTP mode (self-hosted) — use with:
# docker compose -f docker-compose.http.yml up
services:
  email:
    build:
      context: .
      target: http
    environment:
      - TRANSPORT_MODE=http
      - HOME=/data
      # Required: the container binds 0.0.0.0, so it refuses to start without a
      # scrypt bearer-token hash. Mint it with: printf '%s' "$TOKEN" | email token hash
      - EMAIL_MCP_TOKEN_HASH=${EMAIL_MCP_TOKEN_HASH:?Set the scrypt hash of the bearer token}
    # Published on host loopback only: reach it as http://localhost:8082, or put
    # your own TLS reverse proxy on the same host in front of it.
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - email-data:/data
volumes:
  email-data:
